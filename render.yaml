services:
  - type: web
    name: vinca-relay
    runtime: docker
    dockerfilePath: ./services/chain-relay/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: WEB_ORIGIN
        value: "https://vincaonzec.vercel.app"
      - key: LIGHTWALLETD_TESTNET_URL
        value: "https://testnet.zec.rocks:443"
      - key: RUST_LOG
        value: "info,vinca_chain_relay=info"
