services:
  - type: web
    name: vinca-relay
    runtime: docker
    dockerfilePath: ./services/chain-relay/Dockerfile
    # Build context must be the repo root so the Dockerfile can COPY Cargo.toml,
    # crates/, vendor/, and services/chain-relay/ as a unified Cargo workspace.
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: WEB_ORIGIN
        value: "https://vincaonzec.vercel.app"
      - key: LIGHTWALLETD_TESTNET_URL
        value: "https://testnet.zec.rocks:443"
      - key: RUST_LOG
        value: "info,vinca_chain_relay=info"
